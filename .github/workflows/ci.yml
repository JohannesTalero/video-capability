name: CI
on:
  pull_request:
    branches: [main, develop, "release/**"]
  push:
    branches: [main, develop, "release/**", "hotfix/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --frozen --only-group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run mypy pipeline/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run pytest -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --frozen
      # CVE-2025-3000: torch.jit.script memory corruption, LOCAL-only attack,
      # no upstream fix version. torch is a transitive dep of openai-whisper and
      # we never feed untrusted input to torch.jit.script (Whisper uses torch
      # internally on our own audio). Same rationale as the fastapi/uvicorn
      # MAL-2026-4750 note in pyproject.toml. Re-evaluate when a fix ships.
      - run: uv run pip-audit --ignore-vuln CVE-2025-3000
      - run: uv run bandit -r pipeline/ -c pyproject.toml
