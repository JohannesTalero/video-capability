[project]
name = "phymac-pipeline"
version = "0.1.0"
description = "PhyMaC Video Auto-Edit Pipeline (AIDLC)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Johannes Talero", email = "johannes.talero@gmail.com" }]
dependencies = [
    "boto3>=1.34.0",
    "openai-whisper>=20231117",
    "torch>=2.0.0",
    "openai>=1.40.0",
    "modal>=0.63.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scripts/*.py do `sys.path.insert()` before importing `pipeline.*`
# so the script can run without the package being installed.
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
